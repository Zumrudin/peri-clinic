<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1104px;height:308px;background:#B7C9B8}
.banner{position:relative;width:1104px;height:308px;overflow:hidden;background:#B7C9B8;color:#26312A;font-family:'Golos Text',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.banner::before{content:'';position:absolute;inset:0;background:radial-gradient(90% 130% at 8% 0%,#C3D3C4 0%,rgba(255,255,255,0) 62%)}

.note{position:absolute;left:46px;bottom:18px;font-size:13.5px;line-height:1.2;color:#44503F}
.art{position:absolute;inset:0;pointer-events:none}
.arch{position:absolute;bottom:0;border-radius:999px 999px 0 0}
.arch--line{left:974px;width:150px;height:252px;border:2px solid #F4EFE6;border-bottom:0;background:rgba(244,239,230,.22)}
.arch--side{left:758px;width:136px;height:206px;background:#C9A96B}
