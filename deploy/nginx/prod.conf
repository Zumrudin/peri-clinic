# ============================================================
# Peri Clinic — production on the Beget VPS (217.114.0.254, shared with LoyalPro)
#   www.peri-clinic.ru  → static site  /srv/peri/current
#   peri-clinic.ru      → 301 to www (canonical host, see astro.config.mjs `site`)
#   cms.peri-clinic.ru  → Directus     127.0.0.1:8055
# Port 80: ACME challenge + redirect to HTTPS. TLS listens on :443 directly
# (no sslh on this box, unlike the dev stand — see stand.conf).
#
# Certificate paths live in /etc/nginx/snippets/peri-tls.conf so the same server
# blocks work first with a self-signed placeholder (pre-DNS smoke tests via
# `curl -k --resolve`) and then with Let's Encrypt without touching this file.
#
# Install: cp deploy/nginx/redirects.map            /etc/nginx/peri-redirects.map
#          cp deploy/nginx/conf.d/peri-limits.conf  /etc/nginx/conf.d/
#          cp deploy/nginx/snippets/peri-*.conf     /etc/nginx/snippets/
#          cp deploy/nginx/prod.conf                /etc/nginx/sites-available/peri-prod.conf
#          ln -s ../sites-available/peri-prod.conf  /etc/nginx/sites-enabled/
# Do NOT declare `upstream loyalpro_backend` here — it belongs to sites-enabled/zumrudin.
# ============================================================

# --- HTTP ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name peri-clinic.ru www.peri-clinic.ru cms.peri-clinic.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- apex → www ------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peri-clinic.ru;
    include /etc/nginx/snippets/peri-tls.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.peri-clinic.ru$request_uri;
    }
}

# --- Site ----------------------------------------------------
map $uri $peri_redirect {
    include /etc/nginx/peri-redirects.map;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.peri-clinic.ru;
    include /etc/nginx/snippets/peri-tls.conf;

    root /srv/peri/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/peri_access.log;
    error_log  /var/log/nginx/peri_error.log;

    # HSTS without preload until the domain has lived on this host for a while.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    # precompress.mjs also writes .br siblings; enable `brotli_static on;` once
    # libnginx-mod-http-brotli is installed (not present on this box as of 2026-09-16).

    include /etc/nginx/snippets/peri-cert-request.conf;

    # Astro emits hashed files under /_astro/ — cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Documents uploaded via the CMS (licence PDF etc.), read-only.
    location /uploads/ {
        alias /srv/peri/directus/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        location ~* \.(pdf|jpe?g|png|webp|avif|svg)$ { }
        return 404;
    }

    # Old-style trailing slashes → clean URLs (Astro build.format: 'file').
    rewrite ^/(.+)/$ /$1 permanent;

    # Stale/duplicate Wix pages found during phase-4 migration — see redirects.map.
    if ($peri_redirect) {
        return 301 $peri_redirect;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}

# --- CMS -----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.peri-clinic.ru;
    include /etc/nginx/snippets/peri-tls.conf;

    access_log /var/log/nginx/peri_cms_access.log;
    error_log  /var/log/nginx/peri_cms_error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64m;

    # Return a readable API error when nginx rejects a file before Directus sees it.
    error_page 413 = @peri_upload_too_large;
    location @peri_upload_too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"errors":[{"message":"Файл слишком большой. Видео — не более 50 МБ. Сожмите файл или выберите короткий фрагмент.","extensions":{"code":"PAYLOAD_TOO_LARGE"}}]}';
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /auth/login {
        limit_req zone=peri_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8055;
        include /etc/nginx/snippets/peri-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8055;
        include /etc/nginx/snippets/peri-proxy.conf;
    }
}
