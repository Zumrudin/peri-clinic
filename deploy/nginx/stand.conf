# ============================================================
# Peri Clinic — dev stand on the shared VPS
#   peri.zumrudin.ru      → static site  /srv/peri/current
#   peri-cms.zumrudin.ru  → Directus     127.0.0.1:8055
# Port 80: ACME challenge + redirect to HTTPS.
# TLS terminates on 127.0.0.1:4443 (sslh owns :443 on this box).
# Install: cp deploy/nginx/redirects.map /etc/nginx/peri-redirects.map
#          cp deploy/nginx/stand.conf /etc/nginx/sites-available/peri-stand.conf
#          ln -s ../sites-available/peri-stand.conf /etc/nginx/sites-enabled/
# ============================================================

# --- HTTP ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name peri.zumrudin.ru peri-cms.zumrudin.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Site ----------------------------------------------------
map $uri $peri_redirect {
    include /etc/nginx/peri-redirects.map;
}

server {
    listen 127.0.0.1:4443 ssl http2;
    server_name peri.zumrudin.ru;

    ssl_certificate     /etc/letsencrypt/live/peri.zumrudin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peri.zumrudin.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_peri:10m;
    ssl_session_timeout 10m;

    root /srv/peri/current;
    index index.html;
    charset utf-8;

    # Stand only: keep search engines away until launch.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Astro emits hashed files under /_astro/ — cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Documents uploaded via the CMS (licence PDF etc.), read-only.
    location /uploads/ {
        alias /srv/peri/directus/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        location ~* \.(pdf|jpe?g|png|webp|avif|svg)$ { }
        return 404;
    }

    # Old-style trailing slashes → clean URLs (Astro build.format: 'file').
    rewrite ^/(.+)/$ /$1 permanent;

    # Stale/duplicate Wix pages found during phase-4 migration — see redirects.map.
    if ($peri_redirect) {
        return 301 $peri_redirect;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}

# --- CMS -----------------------------------------------------
server {
    listen 127.0.0.1:4443 ssl http2;
    server_name peri-cms.zumrudin.ru;

    ssl_certificate     /etc/letsencrypt/live/peri.zumrudin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peri.zumrudin.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64m;

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /auth/login {
        limit_req zone=peri_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8055;
        include /etc/nginx/snippets/peri-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8055;
        include /etc/nginx/snippets/peri-proxy.conf;
    }
}
