# ============================================================
# Peri Clinic — temporary preview hostname for the production box while the real
# domain still points at Wix: prod.peri-clinic.zumrudin.ru → /srv/peri/current.
# Same release as www.peri-clinic.ru will serve; only differences: noindex (search
# engines must not index the preview) and no HSTS (nothing to commit to on a temp host).
# Canonical/sitemap/OG URLs inside the HTML still say www.peri-clinic.ru — that is the
# build's SITE_URL and is intentional: the preview shows exactly what production will ship.
# Remove this file (and its cert) after the DNS cutover.
#
# Install: cp deploy/nginx/prod-preview.conf /etc/nginx/sites-available/peri-preview.conf
#          ln -s ../sites-available/peri-preview.conf /etc/nginx/sites-enabled/
#          certbot certonly --webroot -w /var/www/certbot -d prod.peri-clinic.zumrudin.ru \
#                  --deploy-hook "systemctl reload nginx"
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name prod.peri-clinic.zumrudin.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prod.peri-clinic.zumrudin.ru;
    include /etc/nginx/snippets/peri-preview-tls.conf;

    root /srv/peri/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/peri_preview_access.log;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/snippets/peri-cert-request.conf;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location /uploads/ {
        alias /srv/peri/directus/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        location ~* \.(pdf|jpe?g|png|webp|avif|svg)$ { }
        return 404;
    }

    rewrite ^/(.+)/$ /$1 permanent;

    if ($peri_redirect) {
        return 301 $peri_redirect;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
