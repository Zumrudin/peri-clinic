# New site is indexable on prod.peri-clinic.zumrudin.ru. Build with matching SITE_URL.
# Keep the CMS and development stand noindex; Wix is managed separately.

server {
    listen 80;
    listen [::]:80;
    server_name prod.peri-clinic.zumrudin.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prod.peri-clinic.zumrudin.ru;
    include /etc/nginx/snippets/peri-preview-tls.conf;

    root /srv/peri/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/peri_preview_access.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/snippets/peri-cert-request.conf;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location /uploads/ {
        alias /srv/peri/directus/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        location ~* \.(pdf|jpe?g|png|webp|avif|svg)$ { }
        return 404;
    }

    # Match only client requests: internal error_page /404.html must stay a 404.
    if ($request_uri ~ "^/index\.html(?:\?|$)") { return 301 /$is_args$args; }
    if ($request_uri ~ "^/(.+)\.html(?:\?|$)") { return 301 /$1$is_args$args; }
    rewrite ^/(.+)/$ /$1 permanent;
    location = /404 { return 404; }


    if ($peri_redirect) {
        return 301 $peri_redirect;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
