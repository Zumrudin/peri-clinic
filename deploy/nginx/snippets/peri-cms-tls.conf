# /etc/nginx/snippets/peri-cms-tls.conf — certificate for the Directus admin host.
# Issued with: certbot certonly --webroot -w /var/www/certbot -d admin-cms.peri-clinic.ru \
#              --deploy-hook "systemctl reload nginx"
ssl_certificate     /etc/letsencrypt/live/admin-cms.peri-clinic.ru/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/admin-cms.peri-clinic.ru/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
