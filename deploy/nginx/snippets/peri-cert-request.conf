# Include inside the site server block. Expose only this clinic's public API.
location ~ "^/api/public/cert-requests/clinic-1(?:/config|/application/[a-f0-9]{48})?$" {
    limit_except GET POST { deny all; }
    client_max_body_size 16k;
    proxy_pass https://forma.zumrudin.ru;
    proxy_ssl_server_name on;
    proxy_ssl_name forma.zumrudin.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host forma.zumrudin.ru;
    proxy_set_header Origin https://forma.zumrudin.ru;
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    # Overwrite the caller-supplied chain: LoyalPro limits by the first IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    access_log off;
}
location /api/public/cert-requests/ { return 404; }
