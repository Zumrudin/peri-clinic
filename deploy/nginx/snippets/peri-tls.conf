# /etc/nginx/snippets/peri-tls.conf — certificate + TLS settings shared by the
# three production server blocks in prod.conf.
#
# Bootstrap order: before DNS points here, certbot cannot pass HTTP-01, so install a
# self-signed placeholder first (lets `nginx -t` pass and pre-DNS smoke tests run):
#   openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days 30 \
#     -subj "/CN=peri-clinic.ru" -addext "subjectAltName=DNS:peri-clinic.ru,DNS:www.peri-clinic.ru,DNS:cms.peri-clinic.ru" \
#     -keyout /etc/nginx/peri-selfsigned/privkey.pem -out /etc/nginx/peri-selfsigned/fullchain.pem
# Then, once Let's Encrypt has issued /etc/letsencrypt/live/peri-clinic.ru/, point the
# two paths below there and `nginx -t && systemctl reload nginx`.
ssl_certificate     /etc/letsencrypt/live/peri-clinic.ru/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/peri-clinic.ru/privkey.pem;

# Overrides the box-wide `ssl_protocols TLSv1 TLSv1.1 …` in nginx.conf for our hosts only.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL_peri:10m;
ssl_session_timeout 10m;
